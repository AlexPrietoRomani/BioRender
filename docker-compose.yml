services:
  # ── API Gateway (Rust Axum) ──
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - POSE_SERVICE_URL=http://pose-rt:8001
    depends_on:
      - pose-rt

  # ── Pipeline C: Inferencia en Tiempo Real (FastAPI + Python) ──
  pose-rt:
    build:
      context: ./services/realtime/ms_pose_rt
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
