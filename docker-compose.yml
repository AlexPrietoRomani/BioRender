name: biorender

services:
  # ── Frontend (Astro SSG + nginx) ──
  frontend:
    container_name: biorender-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_GATEWAY_HTTP_URL: http://localhost:8080
    ports:
      - "4321:80"
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ── API Gateway (Rust Axum) ──
  gateway:
    container_name: biorender-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - POSE_SERVICE_URL=http://biorender-pose-rt:8001
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      pose-rt:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # ── Pipeline A Legacy: Proyección Facial CPU (Celery) ──
  worker-generation:
    container_name: biorender-worker-generation
    build:
      context: ./services/generation_3d/ms_face_project
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  # ── Pipeline C: Inferencia en Tiempo Real (FastAPI + Python) ──
  pose-rt:
    container_name: biorender-pose-rt
    build:
      context: ./services/realtime/ms_pose_rt
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - REDIS_URL=redis://biorender-redis:6379
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  # ═══════════════════════════════════════════════════════════════
  # FASE 7 — Modernización Pipeline A con Modelos SOTA 2025-2026
  # ═══════════════════════════════════════════════════════════════

  # ── MS 7.1: Preprocesamiento Robusto (BiRefNet + Normalización) ──
  ms-preprocess:
    container_name: biorender-ms-preprocess
    build:
      context: ./services/generation_3d/ms_preprocess
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ── MS 7.2: Auto-Detección Hardware + Clasificador Personaje ──
  ms-router:
    container_name: biorender-ms-router
    build:
      context: ./services/generation_3d/ms_router
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ── MS 7.3a: Generación 3D Quality (TripoSG/TRELLIS, GPU ≥16GB) ──
  ms-generation-triposg:
    container_name: biorender-ms-generation-triposg
    build:
      context: ./services/generation_3d/ms_generation_triposg
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
      - GENERATION_MODEL=triposg
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16G
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]

  # ── MS 7.3b: Generación 3D Balanced (SF3D, GPU 7-16GB) ──
  ms-generation-sf3d:
    container_name: biorender-ms-generation-sf3d
    build:
      context: ./services/generation_3d/ms_generation_sf3d
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G

  # ── MS 7.3c: Generación 3D CPU (TripoSR, sin GPU) ──
  ms-generation-triposr-cpu:
    container_name: biorender-ms-generation-triposr-cpu
    build:
      context: ./services/generation_3d/ms_generation_triposr_cpu
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  # ── MS 7.3d: Generación 3D Anime (CharacterGen, personajes estilizados) ──
  ms-generation-chargen:
    container_name: biorender-ms-generation-chargen
    build:
      context: ./services/generation_3d/ms_generation_chargen
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 12G

  # ── MS 7.4a: Auto-Rigging UniRig (SIGGRAPH 2025) ──
  ms-rigging-unirig:
    container_name: biorender-ms-rigging-unirig
    build:
      context: ./services/generation_3d/ms_rigging_unirig
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G

  # ── MS 7.4b: Auto-Rigging MIA Fallback (Make-It-Animatable, CVPR 2025) ──
  ms-rigging-mia:
    container_name: biorender-ms-rigging-mia
    build:
      context: ./services/generation_3d/ms_rigging_mia
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G

  # ── MS 7.5: Validador Automático de Rig ──
  ms-rig-validator:
    container_name: biorender-ms-rig-validator
    build:
      context: ./services/generation_3d/ms_rig_validator
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ── MS 7.6: Orquestador Multi-Ruta + Ensamblador GLB ──
  ms-orchestrator:
    container_name: biorender-ms-orchestrator
    build:
      context: ./services/generation_3d/ms_orchestrator
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ── Message Broker & State Store (Redis) ──
  redis:
    image: redis:7-alpine
    container_name: biorender-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Object Storage (MinIO) ──
  minio:
    image: minio/minio:latest
    container_name: biorender-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=biorenderadmin
      - MINIO_ROOT_PASSWORD=biorendersecret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  redis_data:
    name: biorender_redis_data
  minio_data:
    name: biorender_minio_data
