name: biorender

services:
  # ── Frontend (Astro SSG + nginx) ──
  frontend:
    container_name: biorender-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # El navegador del usuario accede al gateway por localhost; se bake en el build de Astro
        PUBLIC_GATEWAY_HTTP_URL: http://localhost:8080
    ports:
      - "4321:80"
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ── API Gateway (Rust Axum) ──
  gateway:
    container_name: biorender-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - POSE_SERVICE_URL=http://biorender-pose-rt:8001
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      pose-rt:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # ── Pipeline A Worker: Proyección Facial CPU (Celery) ──
  worker-generation:
    container_name: biorender-worker-generation
    build:
      context: ./services/generation_3d/ms_face_project
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://biorender-redis:6379
      - MINIO_ENDPOINT=http://biorender-minio:9000
      - MINIO_ACCESS_KEY=biorenderadmin
      - MINIO_SECRET_KEY=biorendersecret
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  # ── Pipeline C: Inferencia en Tiempo Real (FastAPI + Python) ──
  pose-rt:
    container_name: biorender-pose-rt
    build:
      context: ./services/realtime/ms_pose_rt
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - REDIS_URL=redis://biorender-redis:6379
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
        # Para habilitar aceleración GPU en hosts con nvidia-container-toolkit, descomentar este bloque:
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]

  # ── Message Broker & State Store (Redis) ──
  redis:
    image: redis:7-alpine
    container_name: biorender-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Object Storage (MinIO) ──
  minio:
    image: minio/minio:latest
    container_name: biorender-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=biorenderadmin
      - MINIO_ROOT_PASSWORD=biorendersecret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  redis_data:
    name: biorender_redis_data
  minio_data:
    name: biorender_minio_data

