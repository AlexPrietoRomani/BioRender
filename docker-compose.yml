name: biorender

services:
  # ── API Gateway (Rust Axum) ──
  gateway:
    container_name: biorender-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - POSE_SERVICE_URL=http://biorender-pose-rt:8001
    depends_on:
      - pose-rt
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # ── Pipeline C: Inferencia en Tiempo Real (FastAPI + Python) ──
  pose-rt:
    container_name: biorender-pose-rt
    build:
      context: ./services/realtime/ms_pose_rt
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
